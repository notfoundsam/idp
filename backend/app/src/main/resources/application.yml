spring:
  application:
    name: app
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    encoding:
      force-response: true
    multipart:
      max-file-size: ${idp.admin.max-upload-size}
      max-request-size: ${idp.admin.max-upload-size}
      # A file below it stays in memory, so an upload never lands on the disk.
      file-size-threshold: ${idp.admin.max-upload-size}
  ssl:
    bundle:
      pem:
        # The CA of the collector, and no other: without it the exporters would trust the JVM store.
        otlp:
          truststore:
            certificate: ${OTLP_TLS_CA:}

idp:
  tenants:
    cache-ttl: 30s
  release:
    version: ${APP_VERSION:dev}
    min-client-version: ${MIN_CLIENT_VERSION:}
  login:
    # Above what the limit on starting flows lets in during the 15 minutes a flow lives, so filling it needs Valkey to be down.
    max-open-flows: 100000
    max-request-size: 32KB
  admin:
    # The largest metadata file of 128 KiB with the name and the framing of the form. A larger file within it is refused by the importer.
    max-upload-size: 160KB
  client-ip:
    trusted-header: ${CLIENT_IP_HEADER:}
  kms:
    new-keys: ${KMS_NEW_KEYS}
    key-cache-ttl: 5m
    openbao:
      address: ${OPENBAO_ADDRESS:}
      token: ${OPENBAO_TOKEN:}
    aws:
      region: ${KMS_AWS_REGION:}
      key-policy: ${KMS_AWS_KEY_POLICY:}
  throttle:
    enabled: ${THROTTLE_ENABLED:true}
    multiplier: ${THROTTLE_MULTIPLIER:1}
    ip-hmac-key: ${THROTTLE_IP_HMAC_KEY}
    default:
      capacity: 300
      period: 1m
    valkey:
      url: ${VALKEY_URL}
      password: ${VALKEY_PASSWORD:}
      # PEM certificates of the CAs a rediss:// server is trusted through, the JVM trust store never.
      tls-ca: ${VALKEY_TLS_CA:}
      timeout: 100ms
      connect-timeout: 1s
      cooldown: 30s

server:
  port: 8080
  # Only the local environment and tests switch TLS off, the deployed profiles refuse it. See docs/security/communications.md.
  ssl: &server-tls
    enabled: ${SERVER_TLS_ENABLED:true}
    certificate: ${SERVER_TLS_CERT:}
    certificate-private-key: ${SERVER_TLS_KEY:}
    enabled-protocols: TLSv1.3,TLSv1.2

# One JSON object per line, in UTC, with the MDC fields as keys. See docs/security/logging.md.
logging:
  structured:
    format:
      console: ecs

management:
  tracing:
    propagation:
      # app faces the internet, and a client that sets traceparent would choose the sampling and the trace IDs of the services.
      consume: ""
  server:
    port: 8081
    ssl: *server-tls
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health
  # Spring Boot maps OTEL_EXPORTER_OTLP_ENDPOINT to the trace exporter, which stays off without it.
  # Metrics would go to localhost by default, so they wait for OTEL_METRICS_EXPORTER=otlp.
  otlp:
    metrics:
      export:
        enabled: false
        ssl:
          bundle: otlp
  opentelemetry:
    tracing:
      export:
        otlp:
          ssl:
            bundle: otlp
    logging:
      export:
        otlp:
          ssl:
            bundle: otlp
