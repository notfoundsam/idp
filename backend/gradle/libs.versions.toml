[versions]
kotlin = "2.4.20"
kotest = "6.2.6"
ktlint-gradle = "14.2.0"
spring-boot = "4.1.2"
archunit = "1.5.1"
aws-sdk = "2.46.7"
tink = "1.24.0"
bucket4j = "8.21.0"
bouncycastle = "1.86"

[libraries]
kotest-runner = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-web = { module = "org.springframework:spring-web" }
spring-context = { module = "org.springframework:spring-context" }
jakarta-servlet-api = { module = "jakarta.servlet:jakarta.servlet-api" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
spring-boot-starter-mail = { module = "org.springframework.boot:spring-boot-starter-mail" }
spring-jdbc = { module = "org.springframework:spring-jdbc" }
spring-test = { module = "org.springframework:spring-test" }
caffeine = { module = "com.github.ben-manes.caffeine:caffeine" }
jackson-databind = { module = "tools.jackson.core:jackson-databind" }
jackson-module-kotlin = { module = "tools.jackson.module:jackson-module-kotlin" }
slf4j-api = { module = "org.slf4j:slf4j-api" }
logback-classic = { module = "ch.qos.logback:logback-classic" }
micrometer-core = { module = "io.micrometer:micrometer-core" }
lettuce-core = { module = "io.lettuce:lettuce-core" }
bucket4j-lettuce = { module = "com.bucket4j:bucket4j_jdk17-lettuce", version.ref = "bucket4j" }
aws-sdk-kms = { module = "software.amazon.awssdk:kms", version.ref = "aws-sdk" }
aws-sdk-sts = { module = "software.amazon.awssdk:sts", version.ref = "aws-sdk" }
tink = { module = "com.google.crypto.tink:tink", version.ref = "tink" }
bouncycastle = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
jooq = { module = "org.jooq:jooq" }
jooq-codegen = { module = "org.jooq:jooq-codegen" }
postgresql = { module = "org.postgresql:postgresql" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
