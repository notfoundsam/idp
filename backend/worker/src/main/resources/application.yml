spring:
  application:
    name: worker
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  task:
    scheduling:
      # The outbox and the jobs have a thread each, so a long provisioning does not hold back the cleanup.
      pool:
        size: 2
      shutdown:
        await-termination: true
        await-termination-period: 30s
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.ssl.checkserveridentity: true
      mail.smtp.ssl.protocols: TLSv1.3 TLSv1.2
      # A send holds a tenant transaction, and JavaMail waits forever by default.
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  ssl:
    bundle:
      pem:
        # The CA of the collector, and no other: without it the exporters would trust the JVM store.
        otlp:
          truststore:
            certificate: ${OTLP_TLS_CA:}

idp:
  tenants:
    base-domain: ${TENANTS_BASE_DOMAIN}
  local-fixtures:
    # Only the local profile reads it: the metadata of the SimpleSAMLphp SP.
    sp-metadata: ${LOCAL_SP_METADATA:}
  mail:
    from: ${MAIL_FROM}
  provisioner:
    # Directly to Postgres: schema locks live in a session, and PgBouncer in transaction mode would lose them.
    url: ${PROVISIONER_DB_URL}
    username: ${PROVISIONER_DB_USERNAME}
    password: ${PROVISIONER_DB_PASSWORD}
  kms:
    new-keys: ${KMS_NEW_KEYS}
    platform-kek-uri: ${PLATFORM_KEK_URI}
    key-cache-ttl: 5m
    # A KEK replaced by a move still opens the backups taken before it. In AWS it lives as long as an entry of the erasure journal.
    previous-kek-retention: ${KMS_PREVIOUS_KEK_RETENTION:35d}
    openbao:
      address: ${OPENBAO_ADDRESS:}
      token: ${OPENBAO_TOKEN:}
    aws:
      region: ${KMS_AWS_REGION:}
      key-policy: ${KMS_AWS_KEY_POLICY:}
  erasures:
    # A bucket with Object Lock in AWS, a file outside the database volume locally. Exactly one of them.
    s3:
      bucket: ${ERASURE_JOURNAL_BUCKET:}
      region: ${ERASURE_JOURNAL_REGION:}
    file: ${ERASURE_JOURNAL_FILE:}
  outbox:
    poll-interval: PT0.5S
  jobs:
    tick-interval: PT1M

# worker serves no API, so its only port is the management one.
server:
  port: 8081

# One JSON object per line, in UTC, with the MDC fields as keys. See docs/security/logging.md.
logging:
  structured:
    format:
      console: ecs

management:
  health:
    # A mail outage is retried through the outbox, it is no reason to replace the worker.
    mail:
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health
  # Spring Boot maps OTEL_EXPORTER_OTLP_ENDPOINT to the trace exporter, which stays off without it.
  # Metrics would go to localhost by default, so they wait for OTEL_METRICS_EXPORTER=otlp.
  otlp:
    metrics:
      export:
        enabled: false
        ssl:
          bundle: otlp
  opentelemetry:
    tracing:
      export:
        otlp:
          ssl:
            bundle: otlp
    logging:
      export:
        otlp:
          ssl:
            bundle: otlp
