spring:
  application:
    name: ops
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    encoding:
      force-response: true
  autoconfigure:
    # Operators log in through SAML alone, so Spring Boot must not create a user with a generated password.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  ssl:
    bundle:
      pem:
        # The CA of the collector, and no other: without it the exporters would trust the JVM store.
        otlp:
          truststore:
            certificate: ${OTLP_TLS_CA:}

idp:
  tenants:
    base-domain: ${TENANTS_BASE_DOMAIN}
    # Between the operator's decision and the deletion of the data. The customer can still change their mind.
    offboarding-grace: P30D
  client-ip:
    trusted-header: ${CLIENT_IP_HEADER:}
  saml:
    # A file with the metadata of the service tenant, taken from its /saml/metadata after the bootstrap and after each key rotation.
    # The CLI does not read it.
    idp-metadata: ${IDP_METADATA_FILE:}
  kms:
    new-keys: ${KMS_NEW_KEYS}
    platform-kek-uri: ${PLATFORM_KEK_URI}
    openbao:
      address: ${OPENBAO_ADDRESS:}
      token: ${OPENBAO_TOKEN:}
    aws:
      region: ${KMS_AWS_REGION:}
      key-policy: ${KMS_AWS_KEY_POLICY:}

server:
  port: 8080
  # Only the local environment and tests switch TLS off, the deployed profiles refuse it. See docs/security/communications.md.
  ssl: &server-tls
    enabled: ${SERVER_TLS_ENABLED:true}
    certificate: ${SERVER_TLS_CERT:}
    certificate-private-key: ${SERVER_TLS_KEY:}
    enabled-protocols: TLSv1.3,TLSv1.2
  servlet:
    session:
      # Idle. The absolute end is the SessionNotOnOrAfter of the assertion.
      timeout: 30m
      cookie:
        name: __Host-ops-session
        secure: true
        http-only: true
        # The IdP lives on a sibling host, so its form post to the ACS is same-site and carries the cookie.
        same-site: strict

# One JSON object per line, in UTC, with the MDC fields as keys. See docs/security/logging.md.
logging:
  structured:
    format:
      console: ecs

management:
  server:
    port: 8081
    ssl: *server-tls
  endpoints:
    web:
      exposure:
        include: health
  # Spring Boot maps OTEL_EXPORTER_OTLP_ENDPOINT to the trace exporter, which stays off without it.
  # Metrics would go to localhost by default, so they wait for OTEL_METRICS_EXPORTER=otlp.
  otlp:
    metrics:
      export:
        enabled: false
        ssl:
          bundle: otlp
  opentelemetry:
    tracing:
      export:
        otlp:
          ssl:
            bundle: otlp
    logging:
      export:
        otlp:
          ssl:
            bundle: otlp
