name: idp

x-java-service: &java-service
  image: amazoncorretto:25.0.5-al2023-headless
  command: ["java", "-jar", "/app/service.jar"]
  user: "65532:65532"
  healthcheck:
    test: ["CMD", "curl", "-fs", "http://localhost:8081/actuator/health"]
    interval: 3s
    timeout: 2s
    retries: 40
  depends_on: &java-depends-on
    role-passwords:
      condition: service_completed_successfully
    pgbouncer:
      condition: service_started
    valkey:
      condition: service_healthy
    mail:
      condition: service_started

# Without a value Compose takes them from `make up-observability` or leaves them out, and the services then export nothing.
x-otel-environment: &otel-environment
  OTEL_EXPORTER_OTLP_ENDPOINT:
  OTEL_METRICS_EXPORTER:
  OTEL_TRACES_SAMPLER: parentbased_always_on

services:
  traefik:
    image: traefik:v3.7.17
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.directory=/etc/traefik/dynamic
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./dev-tools/traefik:/etc/traefik/dynamic:ro
      - ./dev-tools/certs:/certs:ro

  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: idp
    volumes:
      - idp-postgres:/var/lib/postgresql
      - ./dev-tools/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d idp"]
      interval: 2s
      timeout: 2s
      retries: 30

  pgbouncer:
    image: edoburu/pgbouncer:v1.26.1-p0
    volumes:
      - ./dev-tools/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./dev-tools/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      postgres:
        condition: service_healthy

  valkey:
    image: valkey/valkey:9.0.7-alpine3.24
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  openbao:
    image: openbao/openbao:2.7.2
    command: ["server"]
    volumes:
      - ./dev-tools/openbao/config.hcl:/openbao/config/config.hcl:ro
      - idp-openbao:/openbao/file

  openbao-init:
    image: openbao/openbao:2.7.2
    entrypoint: ["sh", "/init.sh"]
    environment:
      BAO_ADDR: http://openbao:8200
    volumes:
      - ./dev-tools/openbao/init.sh:/init.sh:ro
      - idp-openbao:/openbao/file
    depends_on:
      openbao:
        condition: service_started

  mail:
    image: axllent/mailpit:v1.33.0
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    labels:
      - traefik.enable=true
      - traefik.http.routers.mail.rule=Host(`mail.idp.test`)
      - traefik.http.routers.mail.priority=100
      - traefik.http.services.mail.loadbalancer.server.port=8025

  simplesamlphp:
    image: cirrusid/simplesamlphp:v2.5.3.1
    environment:
      SSP_ADMIN_PASSWORD: admin
      SSP_SECRET_SALT: local-development-only
    volumes:
      - ./dev-tools/simplesamlphp/authsources.php:/var/simplesamlphp/config/authsources.php:ro
      - ./dev-tools/simplesamlphp/config-override.php:/var/simplesamlphp/config/config-override.php:ro
      - ./dev-tools/simplesamlphp/whoami.php:/var/simplesamlphp/public/whoami.php:ro
      - ./dev-tools/simplesamlphp/metadata:/var/simplesamlphp/metadata/idp:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.sp.rule=Host(`sp.idp.test`)
      - traefik.http.routers.sp.priority=100
      - traefik.http.services.sp.loadbalancer.server.port=443
      - traefik.http.services.sp.loadbalancer.server.scheme=https
      - traefik.http.services.sp.loadbalancer.serverstransport=self-signed-backend@file

  dashboard:
    image: b4bz/homer:v26.08.3
    volumes:
      - ./dev-tools/dashboard/config.yml:/www/assets/config.yml:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.dashboard.rule=Host(`dashboard.idp.test`)
      - traefik.http.routers.dashboard.priority=100
      - traefik.http.services.dashboard.loadbalancer.server.port=8080

  migrator:
    image: amazoncorretto:25.0.5-al2023-headless
    command: ["java", "-jar", "/app/service.jar"]
    user: "65532:65532"
    environment:
      # Directly to Postgres, because migrations use session locks that PgBouncer would lose.
      DB_URL: jdbc:postgresql://postgres:5432/idp
      DB_USERNAME: idp_owner
      DB_PASSWORD: idp_owner
      # Read only when REAPPLY_ERASURES=true, after a restore. See docs/security/restore-runbook.md.
      ERASURE_JOURNAL_FILE: /var/lib/idp/erasures/journal
      TENANTS_BASE_DOMAIN: idp.test
      KMS_NEW_KEYS: hcvault
      PLATFORM_KEK_URI: hcvault://transit/platform-contacts
      OPENBAO_ADDRESS: http://openbao:8200
      OPENBAO_TOKEN: local-dev-token
    volumes:
      - ./backend/migrator/build/libs/migrator.jar:/app/service.jar:ro
      - idp-erasures:/var/lib/idp/erasures
    depends_on:
      postgres:
        condition: service_healthy
      openbao-init:
        condition: service_completed_successfully
      erasures-init:
        condition: service_completed_successfully

  # The erasure journal has a volume of its own: restoring the database must not roll it back.
  erasures-init:
    image: amazoncorretto:25.0.5-al2023-headless
    # A new volume belongs to root, and the services that write to it run as 65532.
    user: "0:0"
    command: ["chown", "65532:65532", "/var/lib/idp/erasures"]
    volumes:
      - idp-erasures:/var/lib/idp/erasures

  role-passwords:
    image: postgres:18.6-alpine3.24
    entrypoint: ["sh", "/set-role-passwords.sh", "app_runtime", "worker_runtime", "ops_runtime", "provisioner"]
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: idp
      PGSSLMODE: disable
      APP_RUNTIME_PASSWORD: app_runtime
      WORKER_RUNTIME_PASSWORD: worker_runtime
      OPS_RUNTIME_PASSWORD: ops_runtime
      PROVISIONER_PASSWORD: provisioner
    volumes:
      - ./infra/db-bootstrap/set-role-passwords.sh:/set-role-passwords.sh:ro
    depends_on:
      migrator:
        condition: service_completed_successfully

  app:
    <<: *java-service
    environment:
      <<: *otel-environment
      JAVA_TOOL_OPTIONS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
      # Without server-side prepared statements, because PgBouncer shares connections between clients.
      DB_URL: jdbc:postgresql://pgbouncer:5432/idp?prepareThreshold=0
      DB_USERNAME: app_runtime
      DB_PASSWORD: app_runtime
      VALKEY_URL: redis://valkey:6379
      THROTTLE_IP_HMAC_KEY: local-throttle-key
      # Every local request comes from the one address below, the e2e tests included. THROTTLE_MULTIPLIER=1 restores the real limits.
      THROTTLE_MULTIPLIER: ${THROTTLE_MULTIPLIER:-100}
      CLIENT_IP_HEADER: CloudFront-Viewer-Address
      KMS_NEW_KEYS: hcvault
      OPENBAO_ADDRESS: http://openbao:8200
      OPENBAO_TOKEN: local-dev-token
    volumes:
      - ./backend/app/build/libs/app.jar:/app/service.jar:ro
    ports:
      - "127.0.0.1:5005:5005"
    labels:
      - traefik.enable=true
      - traefik.http.routers.app.rule=HostRegexp(`^[a-z0-9-]+\.idp\.test$`) && (PathPrefix(`/api`) || PathPrefix(`/saml`))
      - traefik.http.routers.app.middlewares=viewer-address
      - traefik.http.services.app.loadbalancer.server.port=8080
      # The same header CloudFront sets in production, with a test address.
      - traefik.http.middlewares.viewer-address.headers.customrequestheaders.CloudFront-Viewer-Address=203.0.113.10:50000

  worker:
    <<: *java-service
    environment:
      <<: *otel-environment
      JAVA_TOOL_OPTIONS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
      SPRING_PROFILES_ACTIVE: local
      # Without server-side prepared statements, because PgBouncer shares connections between clients.
      DB_URL: jdbc:postgresql://pgbouncer:5432/idp?prepareThreshold=0
      DB_USERNAME: worker_runtime
      DB_PASSWORD: worker_runtime
      # Directly to Postgres, because schema creation uses session locks that PgBouncer would lose.
      PROVISIONER_DB_URL: jdbc:postgresql://postgres:5432/idp?options=-c%20role%3Didp_owner
      PROVISIONER_DB_USERNAME: provisioner
      PROVISIONER_DB_PASSWORD: provisioner
      TENANTS_BASE_DOMAIN: idp.test
      KMS_NEW_KEYS: hcvault
      PLATFORM_KEK_URI: hcvault://transit/platform-contacts
      OPENBAO_ADDRESS: http://openbao:8200
      OPENBAO_TOKEN: local-dev-token
      MAIL_HOST: mail
      MAIL_PORT: "1025"
      MAIL_FROM: no-reply@idp.test
      ERASURE_JOURNAL_FILE: /var/lib/idp/erasures/journal
      LOCAL_SP_METADATA: /fixtures/sp-metadata.xml
    depends_on:
      <<: *java-depends-on
      erasures-init:
        condition: service_completed_successfully
    healthcheck:
      # Readiness waits for the seed, so `make up` returns only when the tenants exist.
      test: ["CMD", "curl", "-fs", "http://localhost:8081/actuator/health/readiness"]
      interval: 3s
      timeout: 2s
      retries: 40
    volumes:
      - ./backend/worker/build/libs/worker.jar:/app/service.jar:ro
      - idp-erasures:/var/lib/idp/erasures
      - ./dev-tools/simplesamlphp/sp-metadata.xml:/fixtures/sp-metadata.xml:ro
    ports:
      - "127.0.0.1:5006:5005"

  ops:
    <<: *java-service
    environment:
      <<: *otel-environment
      JAVA_TOOL_OPTIONS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
      # The CLI names its caller local-operator instead of asking IAM. The API needs a SAML login through ops-sso either way.
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://pgbouncer:5432/idp?prepareThreshold=0
      DB_USERNAME: ops_runtime
      DB_PASSWORD: ops_runtime
      TENANTS_BASE_DOMAIN: idp.test
      KMS_NEW_KEYS: hcvault
      PLATFORM_KEK_URI: hcvault://transit/platform-contacts
      OPENBAO_ADDRESS: http://openbao:8200
      OPENBAO_TOKEN: local-ops-token
      IDP_METADATA_FILE: /idp/metadata.xml
    volumes:
      - ./backend/ops/build/libs/ops.jar:/app/service.jar:ro
      - idp-ops-metadata:/idp:ro
    depends_on:
      <<: *java-depends-on
      ops-idp-metadata:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:5007:5005"
    labels:
      - traefik.enable=true
      - traefik.http.routers.ops.rule=Host(`ops.idp.test`)
      - traefik.http.routers.ops.priority=100
      - traefik.http.services.ops.loadbalancer.server.port=8080

  # ops trusts the keys of a file it is given. Locally the file comes from the service tenant over the compose network, on every
  # `up`, so it follows a key rotation after a restart. In production an operator puts it in place, see dev-tools/README.md.
  ops-idp-metadata:
    image: amazoncorretto:25.0.5-al2023-headless
    user: "0:0"
    command:
      - sh
      - -c
      - >-
        curl -fsS --max-time 5 --retry 30 --retry-delay 2 --retry-all-errors -H 'Host: ops-sso.idp.test'
        http://app:8080/saml/metadata -o /idp/metadata.xml
    volumes:
      - idp-ops-metadata:/idp
    depends_on:
      app:
        condition: service_healthy
      worker:
        condition: service_healthy

  # Grafana with Tempo, Prometheus and Loki behind one OTLP endpoint. It takes a lot of memory, so it runs only on request.
  lgtm:
    image: grafana/otel-lgtm:0.38.0
    profiles: [observability]
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - idp-lgtm:/data
      - ./dev-tools/lgtm/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/idp.yaml:ro
      - ./dev-tools/lgtm/dashboards:/idp/dashboards:ro
      - ./dev-tools/lgtm/alerts.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/idp.yaml:ro

  # Load scenarios of dev-tools/k6, see dev-tools/README.md. Their metrics go to LGTM, so `make load` needs `make up-observability`.
  k6:
    image: grafana/k6:2.3.0
    profiles: [load]
    working_dir: /scripts
    environment:
      # Go reads the CA of mkcert from here, so the tenants are trusted as in a browser of a developer.
      SSL_CERT_FILE: /certs/rootCA.pem
      K6_NO_USAGE_REPORT: "true"
      K6_OTEL_EXPORTER_PROTOCOL: http/protobuf
      K6_OTEL_HTTP_EXPORTER_ENDPOINT: lgtm:4318
      K6_OTEL_HTTP_EXPORTER_INSECURE: "true"
      K6_OTEL_FLUSH_INTERVAL: 1s
      K6_OTEL_EXPORT_INTERVAL: 5s
      K6_OTEL_SERVICE_NAME: k6
      K6_OTEL_METRIC_PREFIX: k6_
    extra_hosts:
      - acme.idp.test:host-gateway
      - globex.idp.test:host-gateway
      - sp.idp.test:host-gateway
    volumes:
      - ./dev-tools/k6:/scripts:ro
      - ./dev-tools/certs:/certs:ro

  # `make lint-infra` formats, validates and lints infra/terraform with them. Neither talks to AWS.
  terraform:
    image: hashicorp/terraform:1.16.7
    profiles: [infra]
    working_dir: /repo/infra/terraform
    volumes:
      - .:/repo

  tflint:
    image: ghcr.io/terraform-linters/tflint:v0.65.0
    profiles: [infra]
    working_dir: /repo/infra/terraform
    environment:
      # Downloads the AWS ruleset from GitHub, which limits anonymous calls.
      GITHUB_TOKEN:
    volumes:
      - .:/repo
      - idp-tflint-plugins:/root/.tflint.d

  # Builds the apps into idp-web on every change. `make` runs its other commands in one-off containers of the same service.
  frontend:
    image: node:24.22.2-alpine
    working_dir: /app/frontend
    command:
      - sh
      - -c
      - corepack pnpm install --frozen-lockfile && WEB_OUT_DIR=/srv/web exec corepack pnpm -r --parallel --if-present build:watch
    environment:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    healthcheck:
      test: ["CMD-SHELL", "test -f /srv/web/login/index.html && test -f /srv/web/console/index.html"]
      interval: 2s
      timeout: 2s
      retries: 90
    volumes:
      - ./frontend:/app/frontend
      - ./contracts:/app/contracts:ro
      - ./infra/web:/app/infra/web:ro
      - idp-frontend-node-modules:/app/frontend/node_modules
      - idp-corepack-cache:/root/.cache/node/corepack
      - idp-web:/srv/web

  # The browsers of the image belong to one Playwright version, the one of @playwright/test in frontend/e2e. The tenants resolve to
  # Traefik on the host, as in a browser of a developer.
  e2e:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    profiles: [e2e]
    working_dir: /app/frontend/e2e
    entrypoint: ["node", "node_modules/@playwright/test/cli.js"]
    command: ["test"]
    ipc: host
    environment:
      CI:
      CERTS_DIR: /certs
      NODE_EXTRA_CA_CERTS: /certs/rootCA.pem
      SAML_METADATA_DIR: /saml-metadata
    extra_hosts:
      - acme.idp.test:host-gateway
      - globex.idp.test:host-gateway
      - ops.idp.test:host-gateway
      - ops-sso.idp.test:host-gateway
      - mail.idp.test:host-gateway
      - sp.idp.test:host-gateway
    volumes:
      - ./frontend:/app/frontend
      - idp-frontend-node-modules:/app/frontend/node_modules
      - ./dev-tools/certs:/certs:ro
      # A test that rotates the signing key of acme hands SimpleSAMLphp the new metadata, as fetch-idp-metadata.sh does.
      - ./dev-tools/simplesamlphp/metadata:/saml-metadata

  nginx-config:
    image: node:24.22.2-alpine
    command: ["node", "/infra/web/render-nginx.mjs", "/etc/nginx/conf.d/default.conf"]
    volumes:
      - ./infra/web:/infra/web:ro
      - idp-nginx-config:/etc/nginx/conf.d

  # Stands in for S3 behind CloudFront: the same headers, caching and SPA fallback.
  nginx:
    image: nginx:1.30.6-alpine3.24
    volumes:
      - idp-web:/usr/share/nginx/html:ro
      - idp-nginx-config:/etc/nginx/conf.d:ro
    depends_on:
      nginx-config:
        condition: service_completed_successfully
      frontend:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=HostRegexp(`^[a-z0-9-]+\.idp\.test$`) && (Path(`/`) || PathPrefix(`/login`) || PathPrefix(`/console`) || Path(`/invite`) || Path(`/reset-password`) || Path(`/confirm-email`))
      # Below the hosts of the tools and ops, whose routers take every path.
      - traefik.http.routers.web.priority=10
      - traefik.http.services.web.loadbalancer.server.port=80

volumes:
  idp-postgres:
  idp-openbao:
  idp-erasures:
  idp-ops-metadata:
  idp-lgtm:
  idp-frontend-node-modules:
  idp-corepack-cache:
  idp-web:
  idp-nginx-config:
  idp-tflint-plugins:
