openapi: 3.1.0
info:
  title: IdP operator API
  version: 1.0.0
  description: Operators manage tenants here and see no customer data.
paths:
  /api/applications:
    post:
      operationId: submitApplication
      summary: Enter an application on behalf of a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitApplicationRequest"
      responses:
        "201":
          description: The application is waiting for approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/RuleViolated"
  /api/applications/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getApplication
      summary: Read an application
      responses:
        "200":
          description: The application, with the contact masked until the tenant is active and erased after that
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/applications/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: approveApplication
      summary: Approve an application, which starts provisioning
      responses:
        "204":
          description: Approved
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/RuleViolated"
  /api/tenants/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getTenant
      summary: Read a tenant
      responses:
        "200":
          description: The tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/tenants/{id}/suspend:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: suspendTenant
      summary: Suspend an active tenant
      responses:
        "204":
          description: Suspended
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/RuleViolated"
  /api/tenants/{id}/resume:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: resumeTenant
      summary: Resume a suspended tenant
      responses:
        "204":
          description: Resumed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/RuleViolated"
  /api/tenants/{id}/offboarding:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: offboardTenant
      summary: Start offboarding a suspended tenant
      description: >-
        After the waiting period `worker` destroys the KEK of the tenant, which makes every copy of its data unreadable, backups
        included, and drops its schema. Until then the operator can cancel. The subdomain stays taken.
      responses:
        "202":
          description: The deletion waits for the end of the period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Offboarding"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/RuleViolated"
    delete:
      operationId: cancelOffboarding
      summary: Cancel offboarding before the end of the waiting period
      description: The tenant stays suspended, resuming it is a separate action.
      responses:
        "204":
          description: Cancelled
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/RuleViolated"
  /api/tenants/{id}/admin-reinvite:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: reinviteAdmin
      summary: Send a new admin invitation to an address the customer proved outside the system
      description: >-
        The tenant must be active. The address is sealed for `worker`, which alone can reach the tenant, so the answer says nothing
        about whether the tenant knows it. A holder of that address starts over as an invited admin. See the runbook first.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReinviteAdminRequest"
      responses:
        "202":
          description: The request is on its way to `worker`
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/RuleViolated"
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: The request is malformed
    Unauthorized:
      description: The request has no principal
    Forbidden:
      description: The role of the principal does not allow this action
    NotFound:
      description: No such tenant or application
    Conflict:
      description: Someone changed the same record first, so the action can be repeated
    RuleViolated:
      description: The action breaks a domain rule, for example the subdomain is taken
  schemas:
    SubmitApplicationRequest:
      type: object
      additionalProperties: false
      required: [companyName, subdomain, contact]
      properties:
        companyName:
          type: string
        subdomain:
          type: string
        contact:
          type: string
          format: email
          maxLength: 254
    ReinviteAdminRequest:
      type: object
      additionalProperties: false
      required: [contact]
      properties:
        contact:
          type: string
          format: email
          maxLength: 254
    ApplicationCreated:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id:
          type: string
          format: uuid
    Application:
      type: object
      additionalProperties: false
      required: [id, tenantId, companyName, subdomain, contactMask, status]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        companyName:
          type: string
        subdomain:
          type: string
        contactMask:
          type: [string, "null"]
        status:
          type: string
          enum: [SUBMITTED, APPROVED]
    Tenant:
      type: object
      additionalProperties: false
      required: [id, name, status, provisioningStep, offboardingAfter]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [REQUESTED, APPROVED, PROVISIONING, ACTIVE, SUSPENDED, OFFBOARDING, DELETED]
        provisioningStep:
          type: [string, "null"]
        offboardingAfter:
          type: [string, "null"]
          format: date-time
          description: The end of the waiting period while the tenant is offboarding
    Offboarding:
      type: object
      additionalProperties: false
      required: [deletionAfter]
      properties:
        deletionAfter:
          type: string
          format: date-time
