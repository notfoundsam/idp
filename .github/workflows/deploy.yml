name: Deploy

# The order of technical-details is the order of the steps: migrator, the new files, the services, migrator again, the pages,
# the smoke test, then the cleanup. The logic lives in infra/deploy, see docs/testing.md.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to release to
        type: choice
        options: [staging, production]
        required: true
      full:
        description: Release the frontend and the backend whatever changed, also to roll out what Terraform registered
        type: boolean
        default: false
      skip-smoke:
        description: Skip the smoke test, refused unless the environment has had no release yet
        type: boolean
        default: false
      min-client-version:
        description: Oldest frontend that app accepts, raised before a contract step. Empty keeps the one that runs
        type: string
        default: ""

permissions:
  contents: read

# stage, activate and prune of one bucket must never interleave, and the rollback workflow shares the group.
concurrency:
  group: release-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  # Only main is released. The environments admit main alone as well, see infra/terraform/README.md, and this job fails before a
  # reviewer is asked or a token of the environment exists.
  ref:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error title=Release::Only main is released, not ${GITHUB_REF}"
          exit 1

  release:
    needs: ref
    # The tasks run on ARM64, so the images are built on it.
    runs-on: ubuntu-24.04-arm
    environment: ${{ inputs.environment }}
    timeout-minutes: 120
    permissions:
      contents: write
      id-token: write
      # The open Renovate pull requests, whose age the update time frames bound.
      pull-requests: read
    env:
      ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
      - name: Packages of the release scripts
        run: corepack pnpm --dir infra/deploy install --frozen-lockfile
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: release-${{ github.run_number }}
      - name: Settings
        run: aws ssm get-parameter --name "/idp-${ENVIRONMENT}/release" --query Parameter.Value --output text > "$RUNNER_TEMP/release-config.json"
      - name: Plan
        id: plan
        env:
          FULL: ${{ inputs.full }}
          SKIP_SMOKE: ${{ inputs.skip-smoke }}
          MIN_CLIENT_VERSION: ${{ inputs.min-client-version }}
        run: |
          options=()
          if [ "$FULL" = true ]; then options+=(--full); fi
          if [ "$SKIP_SMOKE" = true ]; then options+=(--skip-smoke); fi
          node infra/deploy/plan-release.mjs --config "$RUNNER_TEMP/release-config.json" --commit "$GITHUB_SHA" \
            --run-number "$GITHUB_RUN_NUMBER" --out "$RUNNER_TEMP/release-plan.json" \
            --min-client-version "$MIN_CLIENT_VERSION" "${options[@]}" | tee -a "$GITHUB_OUTPUT"
          { echo '```json'; cat "$RUNNER_TEMP/release-plan.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # docs/security/dependencies.md: the registries, the SBOMs of what will be live, and the time frames, before anything moves.
      - name: Registries
        run: node infra/deploy/registries.mjs
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: corretto
          java-version: "25"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: SBOMs
        id: sbom
        run: make sbom
      - name: Vulnerabilities
        run: make vulnerabilities
      - name: Updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr list --repo "$GITHUB_REPOSITORY" --label dependencies --state open --limit 500 \
            --json number,title,createdAt,labels > "$RUNNER_TEMP/updates.json"
          node infra/deploy/updates.mjs --pulls "$RUNNER_TEMP/updates.json"

      - name: Log in to ECR
        run: |
          registry=$(jq -r '.repositories.app | split("/")[0]' "$RUNNER_TEMP/release-config.json")
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
      - name: Images of infra
        run: node infra/deploy/images.mjs --config "$RUNNER_TEMP/release-config.json" --set infra

      - name: Jars
        if: steps.plan.outputs.backend == 'true'
        run: ./gradlew bootJar
        working-directory: backend
      - name: Images of the backend
        if: steps.plan.outputs.backend == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: node infra/deploy/images.mjs --config "$RUNNER_TEMP/release-config.json" --set backend --tag "$VERSION"
      - name: Frontend
        if: steps.plan.outputs.frontend == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: make web-release APP_VERSION="$VERSION"

      # The build may have used most of the first session, and the rollout and a rollback need one of their own.
      - if: steps.plan.outputs.rollout == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: release-${{ github.run_number }}-rollout
      # The OS packages of every image that runs after the release, with the same time frames, before anything moves. Pushed
      # images run nowhere until a revision names them.
      - name: Vulnerabilities of the images
        if: steps.plan.outputs.rollout == 'true'
        env:
          BACKEND_VERSION: ${{ steps.plan.outputs.backend-version }}
        run: |
          TRIVY_USERNAME=AWS
          TRIVY_PASSWORD=$(aws ecr get-login-password)
          echo "::add-mask::$TRIVY_PASSWORD"
          export TRIVY_USERNAME TRIVY_PASSWORD
          node infra/deploy/images.mjs --config "$RUNNER_TEMP/release-config.json" --set released --tag "$BACKEND_VERSION" > "$RUNNER_TEMP/images.txt"
          while read -r name image; do
            make image-sbom NAME="$name" IMAGE="$image" < /dev/null
          done < "$RUNNER_TEMP/images.txt"
          make vulnerabilities
      - name: Keep the SBOMs
        if: always() && steps.sbom.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ inputs.environment }}-${{ steps.plan.outputs.version }}
          path: build/sbom/
          retention-days: 90
      # An alarm that went to ALARM before this time does not stop the release, see infra/deploy/alarms.mjs.
      - name: Start
        id: start
        if: steps.plan.outputs.rollout == 'true'
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Register the revisions
        id: register
        if: steps.plan.outputs.rollout == 'true'
        run: >-
          node infra/deploy/release-tasks.mjs register --config "$RUNNER_TEMP/release-config.json"
          --plan "$RUNNER_TEMP/release-plan.json" --state "$RUNNER_TEMP/release-state.json"
      - name: KMS check
        if: steps.plan.outputs.rollout == 'true'
        run: >-
          node infra/deploy/release-tasks.mjs run --config "$RUNNER_TEMP/release-config.json" --task kms-check
          --state "$RUNNER_TEMP/release-state.json"
      - name: Migrator, expand
        if: steps.plan.outputs.backend == 'true'
        run: >-
          node infra/deploy/release-tasks.mjs run --config "$RUNNER_TEMP/release-config.json" --task migrator
          --state "$RUNNER_TEMP/release-state.json"
      - name: Role passwords
        if: steps.plan.outputs.backend == 'true'
        run: node infra/deploy/release-tasks.mjs run --config "$RUNNER_TEMP/release-config.json" --task role-passwords
      - name: Stage the frontend
        if: steps.plan.outputs.frontend == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: >-
          node infra/deploy/release-assets.mjs stage --bucket "$(jq -r .bucket "$RUNNER_TEMP/release-config.json")"
          --version "$VERSION" --dir frontend/release
      - name: Roll out app
        if: steps.plan.outputs.rollout == 'true'
        run: >-
          node infra/deploy/release-tasks.mjs rollout --config "$RUNNER_TEMP/release-config.json"
          --state "$RUNNER_TEMP/release-state.json" --service app
      - name: Roll out worker
        if: steps.plan.outputs.rollout == 'true'
        run: >-
          node infra/deploy/release-tasks.mjs rollout --config "$RUNNER_TEMP/release-config.json"
          --state "$RUNNER_TEMP/release-state.json" --service worker
      - name: Roll out ops
        if: steps.plan.outputs.rollout == 'true'
        run: >-
          node infra/deploy/release-tasks.mjs rollout --config "$RUNNER_TEMP/release-config.json"
          --state "$RUNNER_TEMP/release-state.json" --service ops
      # A tenant that the old worker created during the rollout gets the schema of this release.
      - name: Migrator, again after worker
        if: steps.plan.outputs.backend == 'true'
        run: >-
          node infra/deploy/release-tasks.mjs run --config "$RUNNER_TEMP/release-config.json" --task migrator
          --state "$RUNNER_TEMP/release-state.json"
      - name: Activate the frontend
        if: steps.plan.outputs.frontend == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: node infra/deploy/release-assets.mjs activate --bucket "$(jq -r .bucket "$RUNNER_TEMP/release-config.json")" --version "$VERSION"
      # A login of the synthetic tenant through the test SP of infra/deploy, see docs/release.md, answered by the app of this release.
      - name: Smoke SSO
        id: smoke
        if: steps.plan.outputs.rollout == 'true' && steps.plan.outputs.smoke == 'true'
        env:
          APP_VERSION: ${{ steps.plan.outputs.frontend-version }}
        run: |
          secret=$(jq -er .smoke.secret "$RUNNER_TEMP/release-config.json")
          host=$(jq -er .smoke.host "$RUNNER_TEMP/release-config.json")
          SMOKE_LOGIN=$(aws secretsmanager get-secret-value --secret-id "$secret" --query SecretString --output text)
          login=$(jq -er .login <<<"$SMOKE_LOGIN")
          password=$(jq -er .password <<<"$SMOKE_LOGIN")
          totp_secret=$(jq -er .totpSecret <<<"$SMOKE_LOGIN")
          echo "::add-mask::$login"
          echo "::add-mask::$password"
          echo "::add-mask::$totp_secret"
          export SMOKE_LOGIN
          node infra/deploy/smoke-sso.mjs --host "$host" --app-version "$APP_VERSION"
      - name: Alarms
        if: steps.plan.outputs.rollout == 'true'
        env:
          SINCE: ${{ steps.start.outputs.at }}
        run: node infra/deploy/alarms.mjs --config "$RUNNER_TEMP/release-config.json" --since "$SINCE" --minutes 5
      - name: Verified
        id: verified
        if: steps.plan.outputs.rollout == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: echo "::notice title=Release::${VERSION} is live on ${ENVIRONMENT}"
      - name: Roll back
        if: failure() && steps.register.outcome == 'success' && steps.verified.outcome != 'success'
        run: node infra/deploy/rollback.mjs --config "$RUNNER_TEMP/release-config.json" --state "$RUNNER_TEMP/release-state.json"

      # The api-contract job of CI compares a contract with the last tag of production it reaches, see ADR-007.
      - name: Tag
        if: steps.plan.outputs.rollout == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          git tag "release/${ENVIRONMENT}/${VERSION}" "$GITHUB_SHA"
          git push origin "refs/tags/release/${ENVIRONMENT}/${VERSION}"
      - name: Prune the frontend
        if: steps.plan.outputs.frontend == 'true'
        run: node infra/deploy/prune-assets.mjs --bucket "$(jq -r .bucket "$RUNNER_TEMP/release-config.json")"
      - name: Nothing to release
        if: steps.plan.outputs.rollout != 'true'
        run: echo "::notice title=Release::Nothing changed that ${ENVIRONMENT} runs, so nothing was released"
