name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels the run of the one before; every push to main runs to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A pull request runs the jobs whose paths it changed (infra/deploy/ci-jobs.mjs), a push to main runs all of them.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.jobs.outputs.backend }}
      frontend: ${{ steps.jobs.outputs.frontend }}
      infra: ${{ steps.jobs.outputs.infra }}
      contracts: ${{ steps.jobs.outputs.contracts }}
      e2e: ${{ steps.jobs.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: jobs
        uses: ./.github/actions/ci-jobs

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: corretto
          java-version: "25"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew check
        working-directory: backend

  kms-localstack:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: corretto
          java-version: "25"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew :shared-kernel:localStackTest
        working-directory: backend

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make lint-frontend
      - run: make test-frontend

  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make lint-infra
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: make test-infra
      - run: make test-deploy
      - run: make check-registries

  # The local environment of dev-tools/README.md, set up on the runner as on a laptop: tenants in /etc/hosts, the mkcert CA trusted.
  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: corretto
          java-version: "25"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends mkcert
      - run: make dns-mapping setup-ssl
      - run: make up
      - run: make smoke
      - run: make test-e2e
      - if: failure()
        run: docker compose logs --no-color --tail 300 app worker ops nginx traefik
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: frontend/e2e/playwright-report/
          retention-days: 7

  api-contract:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Old frontends keep calling the backend, so a contract is compared with the last release, not with main: the one of
      # production, whose frontends are the oldest, or of staging while production has none, see ADR-007.
      - id: release
        run: |
          tag=$(git describe --tags --abbrev=0 --match 'release/production/*' 2>/dev/null ||
            git describe --tags --abbrev=0 --match 'release/staging/*' 2>/dev/null || true)
          if [ -z "$tag" ]; then
            echo "::notice title=oasdiff skipped::No release tag yet, so there is no contract to compare with"
          else
            git worktree add .release "$tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - if: steps.release.outputs.tag != ''
        uses: oasdiff/oasdiff-action/breaking@9e56cf8b3aff7edb326d5767d3d23f96127e20c3 # v0.1.21
        with:
          base: .release/contracts/openapi/ops.yaml
          revision: contracts/openapi/ops.yaml
          fail-on: ERR
      - if: steps.release.outputs.tag != '' && hashFiles('.release/contracts/openapi/auth.yaml') != ''
        uses: oasdiff/oasdiff-action/breaking@9e56cf8b3aff7edb326d5767d3d23f96127e20c3 # v0.1.21
        with:
          base: .release/contracts/openapi/auth.yaml
          revision: contracts/openapi/auth.yaml
          fail-on: ERR
      - if: steps.release.outputs.tag != '' && hashFiles('.release/contracts/openapi/account.yaml') != ''
        uses: oasdiff/oasdiff-action/breaking@9e56cf8b3aff7edb326d5767d3d23f96127e20c3 # v0.1.21
        with:
          base: .release/contracts/openapi/account.yaml
          revision: contracts/openapi/account.yaml
          fail-on: ERR
      - if: steps.release.outputs.tag != '' && hashFiles('.release/contracts/openapi/admin.yaml') != ''
        uses: oasdiff/oasdiff-action/breaking@9e56cf8b3aff7edb326d5767d3d23f96127e20c3 # v0.1.21
        with:
          base: .release/contracts/openapi/admin.yaml
          revision: contracts/openapi/admin.yaml
          fail-on: ERR

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  dependency-submission:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: corretto
          java-version: "25"
      - uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          build-root-directory: backend

  # The one check a merge waits for. A job the change did not need is skipped and counts as passed, one that failed or was
  # cancelled does not.
  ci-ok:
    needs: [changes, backend, kms-localstack, frontend, infra, e2e, api-contract, dependency-review, dependency-submission]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "::error title=CI::A job failed or was cancelled: $RESULTS"
          exit 1
      - run: echo "Every job the change needs passed"
